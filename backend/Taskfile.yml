version: "3"

env:
  GOCACHE: "{{.ROOT_DIR}}/.cache/go-build"

tasks:
  setup:
    desc: Download application module dependencies.
    cmds:
      - go mod download

  build:
    desc: Build every backend package.
    cmds:
      - go build ./...

  test:
    desc: Run unit tests with the race detector.
    cmds:
      - go test ./... -race

  integration:
    desc: Run integration-tagged tests with the race detector.
    cmds:
      - go test -tags=integration ./... -race

  lint:
    desc: Run the pinned golangci-lint tool.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run

  migrate:
    desc: Run goose; pass arguments after --.
    cmds:
      - go run github.com/pressly/goose/v3/cmd/goose@v3.28.0 {{.CLI_ARGS}}

  sqlc:
    desc: Generate sqlc code once sqlc.yaml is introduced by Task 8.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  verify:
    desc: Run the complete Backend Foundations Task 1 gate.
    deps:
      - build
      - test
      - integration
      - lint

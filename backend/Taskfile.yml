version: "3"

env:
  GOCACHE: "{{.ROOT_DIR}}/.cache/go-build"

tasks:
  setup:
    desc: Download application module dependencies.
    cmds:
      - go mod download

  build:
    desc: Build every backend package.
    cmds:
      - go build ./...

  test:
    desc: Run unit tests with the race detector.
    cmds:
      - go test ./... -race

  integration:
    desc: Run integration-tagged tests with the race detector.
    cmds:
      - go test -tags=integration ./... -race

  lint:
    desc: Run the pinned golangci-lint tool.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run --build-tags=integration

  fmt-check:
    desc: Fail when Go source is not gofmt-formatted.
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 fmt -d

  migrate:
    desc: Run the embedded migration command; pass up, down, or status after --.
    cmds:
      - go run ./cmd/migrate {{.CLI_ARGS}}

  sqlc:
    desc: Generate the pinned sqlc persistence package.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

  sqlc-diff:
    desc: Fail when committed sqlc output differs from its schema or queries.
    cmds:
      - go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 diff

  curve-vectors-sync:
    desc: Copy the authoritative Solidity curve vectors into backend testdata.
    cmds:
      - go run ./cmd/sync-curve-vectors

  curve-vectors-diff:
    desc: Fail when the backend curve-vector copy differs from the Solidity source.
    cmds:
      - go run ./cmd/sync-curve-vectors --check

  event-abis-sync:
    desc: Copy the authoritative Solidity event ABIs and Foundry fixtures into the backend chain package.
    cmds:
      - go run ./cmd/sync-event-abis

  event-abis-diff:
    desc: Fail when backend event ABIs or Foundry fixtures differ from their contracts sources.
    cmds:
      - go run ./cmd/sync-event-abis --check

  deployments-diff:
    desc: Fail when the backend deployment-manifest copy differs from the contracts source.
    cmds:
      - go run ./cmd/check-deployments

  verify:
    desc: Run the full backend gate -- format, build, test, integration, lint, and drift checks.
    deps:
      - build
      - test
      - integration
      - lint
      - fmt-check
      - sqlc-diff
      - curve-vectors-diff
      - event-abis-diff
      - deployments-diff

version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - depguard
  settings:
    depguard:
      rules:
        curve:
          list-mode: strict
          files:
            - "**/internal/curve/*.go"
            - "**/internal/curve/**/*.go"
          allow:
            - $gostd
        config-purity:
          list-mode: strict
          files:
            - "**/internal/config/*.go"
            - "**/internal/config/**/*.go"
          allow:
            - errors
            - fmt
            - net
            - net/url
            - reflect
            - regexp
            - strconv
            - strings
            - testing
        deployments-boundary:
          list-mode: strict
          files:
            - "**/deployments/*.go"
            - "**/deployments/**/*.go"
          allow:
            - $gostd
            - github.com/ethereum/go-ethereum/common
            - github.com/santhosh-tekuri/jsonschema/v6
        migration-startup-boundary:
          files:
            - "**/cmd/api/*.go"
            - "**/cmd/api/**/*.go"
            - "**/cmd/indexer/*.go"
            - "**/cmd/indexer/**/*.go"
          deny:
            - pkg: github.com/Contictus/launchtap/backend/internal/store/postgres/migrations
              desc: API and indexer startup must never run migrations implicitly
        domain-and-application:
          files:
            - "**/internal/launch/*.go"
            - "**/internal/trading/*.go"
            - "**/internal/token/*.go"
            - "**/internal/holder/*.go"
            - "**/internal/candle/*.go"
            - "**/internal/stats/*.go"
            - "**/internal/metadata/*.go"
            - "**/domain/*.go"
            - "**/application/*.go"
          deny:
            - pkg: github.com/jackc/pgx/v5
              desc: feature and application packages must not depend on PostgreSQL
            - pkg: github.com/Contictus/launchtap/backend/internal/store/postgres
              desc: feature and application packages must not depend on PostgreSQL adapters
            - pkg: github.com/Contictus/launchtap/backend/internal/store/postgres/migrations
              desc: feature and application packages must not depend on migration infrastructure
            - pkg: github.com/Contictus/launchtap/backend/internal/store/postgres/sqlc
              desc: generated sqlc packages must not escape PostgreSQL adapters
            - pkg: github.com/ethereum/go-ethereum/ethclient
              desc: feature and application packages must not depend on Ethereum RPC clients
            - pkg: github.com/Contictus/launchtap/backend/internal/chain
              desc: feature and application packages depend on chain ports, not adapters
            - pkg: github.com/Contictus/launchtap/backend/internal/apiserver
              desc: feature and application packages must not depend on HTTP delivery

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

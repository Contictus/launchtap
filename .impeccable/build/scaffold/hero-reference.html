<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: route-column.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@700&family=Encode+Sans+Semi+Expanded:wght@700&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f7e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-topbar region chrome" data-region="topbar"><!-- dark navy top shell with wordmark and wallet action --></div>
  <div class="r-rail region chrome" data-region="rail"><!-- dark navy navigation rail with route labels --></div>
  <div class="r-hero-title region text" data-region="hero-title"><!-- Explore page title and supporting line --><p style="font-size:var(--r-hero-title-font);font-family:var(--r-hero-title-family),sans-serif;font-weight:var(--r-hero-title-weight);line-height:1.05;margin:0">hero-title</p></div>
  <div class="r-hero-aside region text" data-region="hero-aside"><!-- right aligned product positioning copy --><p style="line-height:1.05;margin:0">hero-aside</p></div>
  <div class="r-phase-tabs region control" data-region="phase-tabs"><!-- Curve and Graduated ticket tabs: rebuild the control's chrome from the crop (comp-spec.mjs --crop phase-tabs); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-lifecycle region chrome" data-region="lifecycle"><!-- vertical lifecycle route and labels --></div>
  <div class="r-search-filter region control" data-region="search-filter"><!-- search field and stage select: rebuild the control's chrome from the crop (comp-spec.mjs --crop search-filter); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-snapshot region chrome" data-region="snapshot"><!-- snapshot freshness label --></div>
  <div class="r-token-header region chrome" data-region="token-header"><!-- token table column headings and ruled header --></div>
  <div class="r-token-rows region chrome" data-region="token-rows"><!-- token discovery rows and ruled body --></div>
  <div class="r-empty-state region text" data-region="empty-state"><!-- empty indexed tokens message --><p style="font-size:var(--r-empty-state-font);font-family:var(--r-empty-state-family),sans-serif;font-weight:var(--r-empty-state-weight);line-height:1.05;margin:0">empty-state</p></div>
  <div class="r-bottom-cta region control" data-region="bottom-cta"><!-- persistent create token action: rebuild the control's chrome from the crop (comp-spec.mjs --crop bottom-cta); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
auto_detect_remappings = false
solc_version = "0.8.36"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
deny = "warnings"
fs_permissions = [
    { access = "read-write", path = "./vectors" },
    { access = "read", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[invariant]
runs = 256
depth = 100
fail_on_revert = true

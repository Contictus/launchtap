name: contracts

on:
  push:
    branches:
      - dev
    paths:
      - "contracts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "contracts/**"
      - ".gitmodules"
      - ".github/workflows/contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: true

      - name: Verify dependency pins
        shell: pwsh
        run: ./contracts/scripts/check-dependencies.ps1

      - name: Check formatting
        working-directory: contracts
        run: forge fmt --check

      - name: Build and report bytecode sizes
        working-directory: contracts
        run: forge build --sizes

      - name: Run tests
        working-directory: contracts
        run: forge test

      - name: Run static analysis
        working-directory: contracts
        run: forge lint --severity high med low info -D warnings
